# Omarchy Phone device profile - OnePlus 6T (fajita).
#
# Sourced by bash under install/ and bin/, and parsed by config/hypr/device.lua,
# so every line stays KEY=value: no expansion, no arrays, no quoting beyond
# plain double quotes.

DEVICE_CODENAME=fajita
DEVICE_NAME="OnePlus 6T"
DEVICE_SOC=sdm845

# Arch ARM (DanctNIX) rather than postmarketOS: it keeps pacman, so Omarchy's
# omarchy-pkg-add and its .packages lists port across without a second package
# idiom to maintain.
DEVICE_BASE=archarm

# Matched against /sys/firmware/devicetree/base/compatible to recognise the
# running device. The node lists several names; any one of them may match.
DEVICE_COMPATIBLE=oneplus,fajita

# Panel. 1080x2340 at scale 3 lands on a 360x780 logical portrait surface -
# the same logical size Android reports, which is what app and touch-target
# sizing downstream assumes.
DEVICE_OUTPUT=DSI-1
DEVICE_MODE=1080x2340
DEVICE_SCALE=3

# The panel is mounted portrait, so the compositor rotates nothing at boot.
DEVICE_TRANSFORM=0

# Adreno 630 on msm/freedreno. Mesa's GLES3 here is what makes Hyprland viable
# on this device at all.
DEVICE_GPU=freedreno

# Peripherals the session and CLI probe for. 0 means the device does not have
# it, so callers skip the hardware instead of polling an absent node.
DEVICE_HAS_MODEM=1
DEVICE_HAS_BATTERY=1
DEVICE_HAS_TORCH=1
DEVICE_HAS_KEYBOARD=0
